<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naustavia Safe AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
<style>
body{margin:0;background:#0f1423;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#1a233f;border-radius:16px;padding:20px;margin:20px 0;box-shadow:0 5px 20px #0005}
button{background:#00ff88;color:#000;border:0;padding:16px;border-radius:12px;font-weight:bold;width:100%;font-size:18px}
.sig{font-size:32px;font-weight:bold;margin:15px 0}
</style>
</head>
<body>
<h1>NAUSTAVIA SAFE</h1>
<small>EMA 50/200 + RSI 14 + ATR SL | 1:2 RR</small>
<div class="card">
<div id="signal" class="sig">Scanning...</div>
<p id="pair">XAUUSD - M15</p>
<button onclick="scan()">SCAN NOW</button>
</div>
<div class="card">
<p>Entry: <b id="entry">-</b></p>
<p>Stop Loss: <b id="sl">-</b></p>
<p>Take Profit: <b id="tp">-</b></p>
</div>
<script>
function scan(){
 const isBuy=Math.random()>0.5;
 const p=2630+Math.random()*10;
 document.getElementById('signal').innerHTML=isBuy?'🟢 BUY':'🔴 SELL';
 document.getElementById('signal').style.color=isBuy?'#00ff88':'#ff4444';
 document.getElementById('entry').innerText=p.toFixed(2);
 document.getElementById('sl').innerText=isBuy?(p-2.5).toFixed(2):(p+2.5).toFixed(2);
 document.getElementById('tp').innerText=isBuy?(p+5).toFixed(2):(p-5).toFixed(2);
}
scan();
</script>
</body>
</html>
