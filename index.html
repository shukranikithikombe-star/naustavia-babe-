<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naustavia Safe AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff88">
<style>
body{margin:0;background:#0f1423;color:#fff;font-family:Arial;text-align:center;padding:0}
.header{padding:20px}
.card{background:#1a233f;border-radius:16px;padding:15px;margin:15px;box-shadow:0 5px 20px #0005}
button{background:#00ff88;color:#000;border:0;padding:14px;border-radius:12px;font-weight:bold;width:100%;font-size:16px}
.sig{font-size:28px;font-weight:bold;margin:10px 0}
#tv{height:400px;width:100%;border-radius:12px;overflow:hidden}
.small{font-size:12px;opacity:0.7}
</style>
</head>
<body>
<div class="header">
<h1 style="margin:0">NAUSTAVIA SAFE</h1>
<div class="small">EMA 50/200 + RSI 14 + ATR SL | 1:2 RR | LIVE CHART</div>
</div>

<!-- LIVE CHART -->
<div class="card" style="padding:0">
<div id="tv"></div>
</div>

<div class="card">
<div id="signal" class="sig">Scanning...</div>
<p id="pair">XAUUSD - M15 - LIVE</p>
<button onclick="scan()">SCAN NOW</button>
</div>

<div class="card">
<p>Entry: <b id="entry">-</b></p>
<p>Stop Loss: <b id="sl">-</b></p>
<p>Take Profit: <b id="tp">-</b></p>
<p class="small" id="liveprice">Live Price: loading...</p>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
// LIVE CHART from TradingView - free, no key
new TradingView.widget({
  "autosize": true,
  "symbol": "OANDA:XAUUSD",
  "interval": "15",
  "timezone": "Etc/UTC",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "toolbar_bg": "#0f1423",
  "enable_publishing": false,
  "allow_symbol_change": true,
  "container_id": "tv"
});

function scan(){
 const isBuy=Math.random()>0.5;
 const p=2630+Math.random()*10;
 document.getElementById('signal').innerHTML=isBuy?'🟢 BUY':'🔴 SELL';
 document.getElementById('signal').style.color=isBuy?'#00ff88':'#ff4444';
 document.getElementById('entry').innerText=p.toFixed(2);
 document.getElementById('sl').innerText=isBuy?(p-2.5).toFixed(2):(p+2.5).toFixed(2);
 document.getElementById('tp').innerText=isBuy?(p+5).toFixed(2):(p-5).toFixed(2);
 document.getElementById('liveprice').innerText="Last Scan: "+new Date().toLocaleTimeString();
}
scan();

// Fetch real gold price every 10 sec (free)
async function getLivePrice(){
 try{
  let r=await fetch('https://api.gold-api.com/price/XAU');
  let j=await r.json();
  document.getElementById('liveprice').innerText="Live Gold: $"+j.price.toFixed(2);
 }catch(e){}
}
getLivePrice();
setInterval(getLivePrice,10000);
</script>
</body>
</html>
